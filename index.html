<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect Four Two-Player</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .cell { width: 60px; height: 60px; border-radius: 50%; background: #1e3a5f; transition: background 0.1s; cursor: pointer; }
  .disc-red { background: #ef4444 !important; }
  .disc-yellow { background: #eab308 !important; }
  .disc-win { box-shadow: 0 0 0 4px #fff, 0 0 16px 6px #fff; }
  .col-hover:hover .cell-empty { background: rgba(255,255,255,0.15); }
  @keyframes dropAnim { from { transform: translateY(-300px); opacity: 0.5; } to { transform: translateY(0); opacity: 1; } }
  .disc-drop { animation: dropAnim 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
</style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">
<h1 class="text-3xl font-bold mb-2">Connect Four</h1>
<div id="status" class="text-lg mb-4 font-semibold"></div>

<div class="flex gap-8 mb-4">
  <div class="text-center">
    <div class="text-red-400 font-bold text-lg">Player 1 (Red)</div>
    <div class="text-4xl font-bold" id="score1">0</div>
  </div>
  <div class="text-center">
    <div class="text-yellow-400 font-bold text-lg">Player 2 (Yellow)</div>
    <div class="text-4xl font-bold" id="score2">0</div>
  </div>
</div>

<div class="bg-blue-800 p-3 rounded-xl shadow-2xl mb-4">
  <div id="board" class="grid gap-2" style="grid-template-columns: repeat(7, 60px);"></div>
</div>

<div class="flex gap-3 flex-wrap justify-center">
  <button onclick="undoMove()" class="px-4 py-2 bg-slate-600 hover:bg-slate-500 rounded-lg font-semibold transition">Undo Last Move</button>
  <button onclick="newGame()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg font-semibold transition">New Game</button>
  <button onclick="resetScores()" class="px-4 py-2 bg-red-700 hover:bg-red-600 rounded-lg font-semibold transition">Reset Scores</button>
</div>

<script>
const ROWS = 6, COLS = 7;
let board, currentPlayer, gameOver, moveHistory, scores;

function init() {
  const stored = localStorage.getItem('c4scores');
  scores = stored ? JSON.parse(stored) : [0, 0];
  newGame();
}

function newGame() {
  board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
  currentPlayer = 1;
  gameOver = false;
  moveHistory = [];
  renderBoard();
  updateStatus();
  updateScores();
}

function resetScores() {
  scores = [0, 0];
  localStorage.setItem('c4scores', JSON.stringify(scores));
  updateScores();
}

function updateScores() {
  document.getElementById('score1').textContent = scores[0];
  document.getElementById('score2').textContent = scores[1];
}

function updateStatus(msg) {
  const el = document.getElementById('status');
  if (msg) { el.textContent = msg; return; }
  const color = currentPlayer === 1 ? 'text-red-400' : 'text-yellow-400';
  el.innerHTML = `<span class="${color}">Player ${currentPlayer}'s turn</span>`;
}

function renderBoard() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell cell-empty';
      cell.dataset.col = c;
      cell.dataset.row = r;
      if (board[r][c] === 1) { cell.classList.add('disc-red'); cell.classList.remove('cell-empty'); }
      else if (board[r][c] === 2) { cell.classList.add('disc-yellow'); cell.classList.remove('cell-empty'); }
      cell.setAttribute('role', 'button');
      cell.setAttribute('aria-label', `Column ${c+1}`);
      cell.setAttribute('tabindex', r === 0 ? '0' : '-1');
      cell.addEventListener('click', () => dropDisc(c));
      cell.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') dropDisc(c); });
      boardEl.appendChild(cell);
    }
  }
}

function dropDisc(col) {
  if (gameOver) return;
  let row = -1;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (board[r][col] === 0) { row = r; break; }
  }
  if (row === -1) return;

  board[row][col] = currentPlayer;
  moveHistory.push({row, col, player: currentPlayer});
  renderBoard();

  // Animate dropped disc
  const cells = document.querySelectorAll('[data-row]');
  const idx = row * COLS + col;
  cells[idx].classList.add('disc-drop');

  const win = checkWin(row, col);
  if (win) {
    win.forEach(([r, c]) => {
      const ci = r * COLS + c;
      cells[ci].classList.add('disc-win');
    });
    scores[currentPlayer - 1]++;
    localStorage.setItem('c4scores', JSON.stringify(scores));
    updateScores();
    updateStatus(`🎉 Player ${currentPlayer} wins!`);
    gameOver = true;
    return;
  }

  if (board[0].every(v => v !== 0)) {
    updateStatus("It's a draw!");
    gameOver = true;
    return;
  }

  currentPlayer = currentPlayer === 1 ? 2 : 1;
  updateStatus();
}

function checkWin(row, col) {
  const player = board[row][col];
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for (const [dr, dc] of dirs) {
    let cells = [[row, col]];
    for (let d = 1; d < 4; d++) {
      const r = row + dr*d, c = col + dc*d;
      if (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] === player) cells.push([r,c]);
      else break;
    }
    for (let d = 1; d < 4; d++) {
      const r = row - dr*d, c = col - dc*d;
      if (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] === player) cells.push([r,c]);
      else break;
    }
    if (cells.length >= 4) return cells.slice(0, 4);
  }
  return null;
}

function undoMove() {
  if (moveHistory.length === 0 || gameOver) return;
  const last = moveHistory.pop();
  board[last.row][last.col] = 0;
  currentPlayer = last.player;
  gameOver = false;
  renderBoard();
  updateStatus();
}

init();
</script>
</body>
</html>
